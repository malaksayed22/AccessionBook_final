# Local development services. `docker compose up -d postgres`, then `npm run dev`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: accession
      POSTGRES_PASSWORD: accession-dev-only
      POSTGRES_DB: accession_book
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accession -d accession_book"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
